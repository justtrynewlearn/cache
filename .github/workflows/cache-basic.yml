name: Cache Basic

on:
  push:
  workflow_dispatch:

jobs:
  cache-test:
    runs-on: ubuntu-latest

    steps:
      - name: Create test file
        run: |
          mkdir -p cache-data
          echo "Hello from Cache" > cache-data/test.txt

      - name: Show file before cache
        run: |
          echo "Before cache:"
          cat cache-data/test.txt

      - name: Save cache
        uses: actions/cache@v4
        with:
          path: cache-data
          key: cache-basic-v1

      - name: Show file after cache
        run: |
          echo "After cache:"
          cat cache-data/test.txt
